<body>
    <script>
        let num = Number(prompt('Nhập số bất kỳ: '));
        alert(`Số đầu tiên là: ${num}`);

        let total = num;

        while (num !== -1) {
            num = Number(prompt('Nhập số bất kỳ: '));

            if (num !== -1) {
                total += num;
                alert(`Tổng hiện tại là: ${total}`);
            }
        }

    </script>
</body>
