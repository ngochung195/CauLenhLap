<body>
    <h2>In dãy Fibonaci</h2>

    <script>
        function inFibonacci(n) {
            let f0 = 0, f1 = 1, fn;

            if (n <= 0) return "Vui lòng nhập số lớn hơn 0";

            document.write(f0 + " "); // In số đầu tiên
            if (n === 1) return;

            document.write(f1 + " "); // In số thứ hai

            for (let i = 2; i < n; i++) {
                fn = f0 + f1;
                document.write(fn + " ");
                f0 = f1;
                f1 = fn;
            }
        }

        inFibonacci(10);
    </script>

</body>
